services:
  backend:
    build:
      context: ./back_
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
      - "9229:9229"
    volumes:
      - ./back_:/app
      - /app/node_modules
      - ./back_/uploads:/app/uploads
    env_file:
      - ./back_/.env
    environment:
      - NODE_ENV=development
      - PORT=3000
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./front_
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./front_:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:3000

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=agendamentos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d agendamentos"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
